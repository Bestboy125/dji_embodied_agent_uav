apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

def localSecrets = new Properties()
def localSecretsFile = rootProject.file('local.properties')
if (localSecretsFile.exists()) {
    localSecretsFile.withInputStream { localSecrets.load(it) }
}
def buildConfigString = { String key, String fallback = '' ->
    def value = localSecrets.getProperty(key, fallback)
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

repositories {
    mavenLocal()
    flatDir {
        dirs 'libs'
    }
}

android {
    compileSdk 34
    useLibrary 'org.apache.http.legacy'
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId "com.dji.sdk.voice_control"
        minSdkVersion 24
        targetSdkVersion 33
        multiDexEnabled true
        versionCode 1
        buildConfigField "String", "OPENAI_API_KEY", buildConfigString('OPENAI_API_KEY')
        buildConfigField "String", "OPENAI_MODEL", buildConfigString('OPENAI_MODEL', 'gpt-4o')
        buildConfigField "String", "OPENAI_BASE_URL", buildConfigString('OPENAI_BASE_URL', 'https://api.openai.com/v1/chat/completions')
        buildConfigField "String", "DASHSCOPE_API_KEY", buildConfigString('DASHSCOPE_API_KEY')
        buildConfigField "String", "DASHSCOPE_MODEL", buildConfigString('DASHSCOPE_MODEL', 'qwen-vl-plus')
        ndk {
            // On x86 devices that run Android API 23 or above, if the application is targeted with API 23 or
            // above, FFmpeg lib might lead to runtime crashes or warnings.
            abiFilters 'armeabi-v7a','arm64-v8a'
        }
    }

    //需要直接使用appbundle的话，需要强制配置shrinkResources为false
    buildTypes {
        release {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets{
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    dexOptions {
        javaMaxHeapSize "4g"
    }

    packagingOptions {
        doNotStrip "*/*/libdjivideo.so"
        doNotStrip "*/*/libSDKRelativeJNI.so"
        doNotStrip "*/*/libFlyForbid.so"
        doNotStrip "*/*/libduml_vision_bokeh.so"
        doNotStrip "*/*/libyuv2.so"
        doNotStrip "*/*/libGroudStation.so"
        doNotStrip "*/*/libFRCorkscrew.so"
        doNotStrip "*/*/libUpgradeVerify.so"
        doNotStrip "*/*/libFR.so"
        doNotStrip "*/*/libDJIFlySafeCore.so"
        doNotStrip "*/*/libdjifs_jni.so"
        doNotStrip "*/*/libsfjni.so"
        doNotStrip "*/*/libDJICommonJNI.so"
        doNotStrip "*/*/libDJICSDKCommon.so"
        doNotStrip "*/*/libDJIUpgradeCore.so"
        doNotStrip "*/*/libDJIUpgradeJNI.so"
        doNotStrip "*/*/libDJIWaypointV2Core.so"
        doNotStrip "*/*/libAMapSDK_MAP_v6_9_2.so"
        doNotStrip "*/*/libDJIMOP.so"
        doNotStrip "*/*/libDJISDKLOGJNI.so"
        pickFirst "libs/armeabi-v7a/libmsc.so"
        pickFirst "libs/arm64-v8a/libmsc.so"
        exclude 'META-INF/rxjava.properties'
        exclude 'assets/location_map_gps_locked.png'
        exclude 'assets/location_map_gps_3d.png'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    configurations {
        all*.exclude module: 'httpclient'
        all*.exclude group: 'com.squareup.okhttp3', module: 'okhttp-ws'

    }
}

dependencies {
    debugImplementation 'com.github.getActivity:Logcat:11.86'

    implementation 'androidx.multidex:multidex:2.0.0'
    implementation 'com.squareup:otto:1.3.8'
    implementation('com.dji:dji-sdk:4.18', {
        /**
         * Uncomment the "library-anti-distortion" if your app does not need Anti Distortion for Mavic 2 Pro and Mavic 2 Zoom.
         * Uncomment the "fly-safe-database" if you need database for release, or we will download it when DJISDKManager.getInstance().registerApp
         * is called.
         * Both will greatly reducing the size of the APK.
         */
        exclude module: 'library-anti-distortion'
        exclude group: 'com.squareup.okhttp3', module: 'okhttp'
        exclude group: 'com.squareup.okhttp3', module: 'okhttp-ws'
